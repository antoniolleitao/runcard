[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runcard"
version = "0.1.0"
description = "Structured, verifiable, re-executable study records for nanoHUB AURA MCP simulation sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
runcard = "runcard.cli:main"

[tool.setuptools.packages.find]
include = ["runcard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
